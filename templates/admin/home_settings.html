{% extends "admin/base_admin.html" %}
{% block title %}הגדרות עמוד הבית | מחשב מחדש{% endblock %}

{% block content %}
<h1 class="admin-page-title">הגדרות עמוד הבית</h1>

<div class="form-card">
  <form method="POST" enctype="multipart/form-data" class="admin-form">

    <div class="form-group">
      <label>תמונת באנר ראשי</label>
      {% if current_hero %}
        <div class="current-image" style="margin-bottom:0.75rem">
          <img src="{{ url_for('static', filename='uploads/' ~ current_hero) }}" alt="באנר נוכחי" style="max-width:400px;border-radius:8px" />
          <p style="font-size:0.85rem;color:#666;margin-top:0.25rem">תמונה נוכחית: {{ current_hero }}</p>
        </div>
      {% endif %}
      <input type="file" name="hero_image" accept="image/*" />
      <small>מומלץ: תמונה רחבה 1920×600 פיקסל</small>
    </div>

    <div class="form-group">
      <label for="opening_hours">שעות פתיחה</label>
      <textarea id="opening_hours" name="opening_hours" rows="6" placeholder="ראשון-חמישי: 09:00 - 18:00&#10;שישי: 09:00 - 13:00&#10;שבת: סגור">{{ current_hours }}</textarea>
      <small>כל שורה תופיע בנפרד</small>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">שמור שינויים</button>
    </div>
  </form>
</div>
{% endblock %}
