<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>כניסת מנהל | מחשב מחדש</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="admin-body">

<div class="login-wrapper">
  <div class="login-card">
    <div class="login-logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="לוגו" onerror="this.src='{{ url_for('static', filename='images/logo.svg') }}'" />
      <h1>מחשב מחדש</h1>
      <p>כניסת מנהל</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" class="login-form">
      <div class="form-group">
        <label for="username">שם משתמש</label>
        <input type="text" id="username" name="username" required autofocus placeholder="admin" />
      </div>
      <div class="form-group">
        <label for="password">סיסמה</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">כניסה</button>
    </form>
  </div>
</div>

</body>
</html>
